name: Deploy frontend to Azure staging

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend-azure-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy and verify frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_URL: ${{ vars.AZURE_API_URL }}
        run: npm run build

      - name: Authenticate to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read the short-lived deployment token
        id: swa-token
        shell: bash
        run: |
          token="$(az staticwebapp secrets list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_STATIC_WEB_APP_NAME }}" \
            --query properties.apiKey --output tsv)"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy prebuilt assets
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          action: upload
          app_location: dist
          output_location: ""
          skip_app_build: true

      - name: Resolve the staging URL
        id: frontend-url
        shell: bash
        run: |
          hostname="$(az staticwebapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_STATIC_WEB_APP_NAME }}" \
            --query defaultHostname \
            --output tsv)"
          echo "url=https://$hostname" >> "$GITHUB_OUTPUT"

      - name: Verify the deployed HTML
        shell: bash
        run: |
          curl --fail --show-error --silent \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "${{ steps.frontend-url.outputs.url }}/connexion" \
            | grep -F '<div id="root"></div>'

      - name: Install the smoke-test browser
        run: npx playwright install --with-deps chromium

      - name: Run public staging smoke tests
        env:
          E2E_BASE_URL: ${{ steps.frontend-url.outputs.url }}
          E2E_SKIP_WEBSERVER: "1"
        run: npm run test:e2e -- e2e/staging-smoke.spec.ts --project=desktop
