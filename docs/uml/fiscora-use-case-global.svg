<line x1="1595" y1="1360" x2="1655" y2="1360" class="generalization" marker-end="url(#triangle)"/><text class="legend" x="1665" y="1364">généralisation (héritage)</text>
<text class="subtitle" x="36" y="1345">Précondition commune : authentification et contrôle des permissions (MFA si activée).</text>
<text class="subtitle" x="36" y="1369">Le propriétaire hérite des actions du collaborateur. Le client reste limité à ses dossiers partagés.</text>
<text class="subtitle" x="36" y="1393">Les services IA assistent le traitement ; la validation comptable et fiscale reste humaine.</text>
