<text class="usecase" x="480" y="315" text-anchor="middle"><tspan x="480" dy="0">Importer, extraire et contrôler</tspan><tspan x="480" dy="16">les pièces</tspan></text>
<ellipse cx="480" cy="434" rx="180" ry="39" fill="#dcefe4" stroke="#48615a" stroke-width="1.2"/>
<text class="usecase" x="480" y="422" text-anchor="middle"><tspan x="480" dy="0">Gérer factures, avoirs,</tspan><tspan x="480" dy="16">règlements et documents</tspan><tspan x="480" dy="16">commerciaux</tspan></text>
<ellipse cx="480" cy="549" rx="180" ry="39" fill="#dcefe4" stroke="#48615a" stroke-width="1.2"/>
<text class="usecase" x="480" y="545" text-anchor="middle"><tspan x="480" dy="0">Préparer la comptabilité, le</tspan><tspan x="480" dy="16">lettrage et les rapprochements</tspan></text>
<ellipse cx="480" cy="664" rx="180" ry="39" fill="#dcefe4" stroke="#48615a" stroke-width="1.2"/>
<text class="usecase" x="480" y="660" text-anchor="middle"><tspan x="480" dy="0">Suivre les échéances et préparer</tspan><tspan x="480" dy="16">les déclarations</tspan></text>
<ellipse cx="480" cy="779" rx="180" ry="39" fill="#dcefe4" stroke="#48615a" stroke-width="1.2"/>
<text class="usecase" x="480" y="775" text-anchor="middle"><tspan x="480" dy="0">Préparer la paie et gérer les</tspan><tspan x="480" dy="16">immobilisations</tspan></text>
<ellipse cx="480" cy="894" rx="180" ry="39" fill="#dcefe4" stroke="#48615a" stroke-width="1.2"/>
<text class="usecase" x="480" y="890" text-anchor="middle"><tspan x="480" dy="0">Produire les états comptables et</tspan><tspan x="480" dy="16">financiers et les exports</tspan></text>
<ellipse cx="480" cy="1009" rx="180" ry="39" fill="#dcefe4" stroke="#48615a" stroke-width="1.2"/>
<text class="usecase" x="480" y="1005" text-anchor="middle"><tspan x="480" dy="0">Traiter les tâches affectées et</tspan><tspan x="480" dy="16">saisir le temps de travail</tspan></text>
<ellipse cx="950" cy="319" rx="180" ry="39" fill="#eadff5" stroke="#48615a" stroke-width="1.2"/>
<text class="usecase" x="950" y="315" text-anchor="middle"><tspan x="950" dy="0">Interroger l’assistant avec des</tspan><tspan x="950" dy="16">sources du dossier</tspan></text>
<ellipse cx="950" cy="549" rx="180" ry="39" fill="#fff1c9" stroke="#48615a" stroke-width="1.2"/>
<text class="usecase" x="950" y="545" text-anchor="middle"><tspan x="950" dy="0">Valider et clôturer les périodes</tspan><tspan x="950" dy="16">comptables</tspan></text>
<ellipse cx="950" cy="664" rx="180" ry="39" fill="#fff1c9" stroke="#48615a" stroke-width="1.2"/>
<text class="usecase" x="950" y="660" text-anchor="middle"><tspan x="950" dy="0">Administrer les dossiers,</tspan><tspan x="950" dy="16">l’équipe et les droits</tspan></text>
<ellipse cx="950" cy="779" rx="180" ry="39" fill="#fff1c9" stroke="#48615a" stroke-width="1.2"/>
<text class="usecase" x="950" y="775" text-anchor="middle"><tspan x="950" dy="0">Affecter, réviser et valider les</tspan><tspan x="950" dy="16">travaux et les temps</tspan></text>
<ellipse cx="950" cy="894" rx="180" ry="39" fill="#fff1c9" stroke="#48615a" stroke-width="1.2"/>
<text class="usecase" x="950" y="890" text-anchor="middle"><tspan x="950" dy="0">Gérer les honoraires et</tspan><tspan x="950" dy="16">l’abonnement du cabinet</tspan></text>
<ellipse cx="950" cy="1009" rx="180" ry="39" fill="#fff1c9" stroke="#48615a" stroke-width="1.2"/>
<text class="usecase" x="950" y="1005" text-anchor="middle"><tspan x="950" dy="0">Suivre les coûts et la</tspan><tspan x="950" dy="16">rentabilité estimée ou facturée</tspan></text>
<ellipse cx="1390" cy="204" rx="180" ry="39" fill="#d9eafd" stroke="#48615a" stroke-width="1.2"/>
<text class="usecase" x="1390" y="200" text-anchor="middle"><tspan x="1390" dy="0">Consulter ses dossiers et les</tspan><tspan x="1390" dy="16">éléments partagés</tspan></text>
<ellipse cx="1390" cy="319" rx="180" ry="39" fill="#d9eafd" stroke="#48615a" stroke-width="1.2"/>
<text class="usecase" x="1390" y="315" text-anchor="middle"><tspan x="1390" dy="0">Déposer et consulter ses</tspan><tspan x="1390" dy="16">documents</tspan></text>
<ellipse cx="1390" cy="434" rx="180" ry="39" fill="#d9eafd" stroke="#48615a" stroke-width="1.2"/>
<text class="usecase" x="1390" y="430" text-anchor="middle"><tspan x="1390" dy="0">Échanger avec le cabinet et</tspan><tspan x="1390" dy="16">approuver les demandes</tspan></text>
<ellipse cx="1390" cy="894" rx="180" ry="39" fill="#fff1c9" stroke="#48615a" stroke-width="1.2"/>
<text class="usecase" x="1390" y="890" text-anchor="middle"><tspan x="1390" dy="0">Superviser les organisations,</tspan><tspan x="1390" dy="16">les comptes et la plateforme</tspan></text>
